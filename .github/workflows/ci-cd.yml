name: Testes da Calculadora

on:
  push:
    branches: [main, demonstracao-erro]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar testes
        working-directory: calculadora-devops
        run: node tests/calculadora.test.js
